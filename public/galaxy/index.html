<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <base href="/galaxy/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>송장번호 찾기</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/ui.js"></script>
</head>
<body>
  <main>
    <h1>이름으로 송장번호 찾기</h1>
    <p class="note">파일은 이 브라우저 안에서만 처리되며 서버로 전송되지 않습니다.</p>

    <section class="card">
      <h2><span class="step">1</span> 이름 붙여넣기</h2>
      <p>한 줄에 한 명씩 붙여넣으세요. 엑셀 열을 그대로 복사해도 됩니다.</p>
      <textarea id="names" rows="10" spellcheck="false" placeholder="홍길동&#10;김철수"></textarea>
    </section>

    <section class="card">
      <h2><span class="step">2</span> 롯데 송장파일 올리기</h2>
      <p>롯데택배 ALPS에서 받은 송장 결과 파일(.xlsx)을 올리세요.</p>
      <label class="drop">
        <input type="file" id="file" accept=".xlsx,.xls">
        <span id="fileName">송장파일 선택</span>
      </label>
    </section>

    <section class="card">
      <h2><span class="step">3</span> 결과</h2>
      <p class="msg" id="msg" role="status"></p>
      <button type="button" id="copyBtn" class="btn" disabled>송장번호만 복사</button>
      <div class="table-wrap">
        <table><tbody id="result"></tbody></table>
      </div>
    </section>
  </main>
</body>
</html>
